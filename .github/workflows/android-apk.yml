name: Build Android Listener APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-listener/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-listener
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Debug & Release Unsigned APK
        run: gradle assembleDebug assembleRelease
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qris-listener-apk
          path: |
            apps/android-listener/app/build/outputs/apk/debug/*.apk
            apps/android-listener/app/build/outputs/apk/release/*.apk
